name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Lint + format run once (platform-independent).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features

  # Build + test on every target OS / arch.
  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-intel
            os: macos-13
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install GUI build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev \
            libx11-dev libgl1-mesa-dev
      - name: test
        run: cargo test --workspace --target ${{ matrix.target }}

  # ARM Linux (aarch64): prove the engine crates are arch-portable via
  # cross-compilation + qemu. The GUI bin is excluded here (a windowed app on
  # headless ARM needs a display stack); it is covered by the desktop matrix.
  cross-arm:
    name: test linux-aarch64 engines (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cross
        run: cargo install cross --locked
      - name: test engines on aarch64
        run: >
          cross test --target aarch64-unknown-linux-gnu
          -p klerq-core -p klerq-i18n -p klerq-plugin
          -p klerq-writer -p klerq-calc -p klerq-slides
